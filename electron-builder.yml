# electron-builder config — Windows NSIS + GitHub Releases auto-update feed.
# Publish flow: set GH_TOKEN env, then `bun run electron:release`. See desktop-docs/RELEASE.md.
# appId is intentionally left as the original com.mart.grocerypos: at least one
# shop already has the app installed under this id, and NSIS/electron-updater
# use it (not productName) to recognize an in-place upgrade vs. a new install.
# Changing it would make the next release look like a different app on that
# machine instead of an update.
appId: com.mart.grocerypos
productName: Tillix POS
directories:
  output: electron-release
  buildResources: electron/build-resources
files:
  - .output/**/*        # nitro node server bundle (spawned by main.cjs)
  - electron/**/*
  - "!electron/build-resources/**"
  - "!**/*.map"
# The Nitro node server (an ESM module tree) must live on the real filesystem
# so child_process.fork can load it — Node cannot fork files that live inside
# the asar archive. Same for our .cjs main scripts that require electron-updater.
asar: true
asarUnpack:
  - ".output/**/*"
  - "electron/**/*"
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: "Tillix-Setup-${version}.exe"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Tillix POS
publish:
  # Releases live in a separate PUBLIC repo that holds only installers, so
  # the source repo (grocery-glee-point) can be made private. electron-updater
  # reads this at build time: every build from here on checks
  # tillix-releases for updates.
  #
  # Apps installed from v0.1.0 still check grocery-glee-point. The first
  # build with this config (v0.1.1, the "bridge" release) must therefore be
  # uploaded to BOTH repos — see desktop-docs/RELEASE.md, "Moving releases
  # to tillix-releases". Don't make grocery-glee-point private until the
  # installed shops have taken that update.
  - provider: github
    owner: shahidmehmoodai52-sketch
    repo: tillix-releases
    releaseType: release
