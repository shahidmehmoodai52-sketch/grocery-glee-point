# electron-builder config — Windows NSIS + GitHub Releases auto-update feed.
# Publish flow: set GH_TOKEN env, then `bun run electron:release`. See desktop-docs/RELEASE.md.
appId: com.mart.grocerypos
productName: Grocery POS
directories:
  output: electron-release
  buildResources: electron/build-resources
files:
  - .output/**/*        # nitro node server bundle (spawned by main.cjs)
  - electron/**/*
  - "!electron/build-resources/**"
  - "!**/*.map"
# The Nitro node server (an ESM module tree) must live on the real filesystem
# so child_process.fork can load it — Node cannot fork files that live inside
# the asar archive. Same for our .cjs main scripts that require electron-updater.
asar: true
asarUnpack:
  - ".output/**/*"
  - "electron/**/*"
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: "GroceryPOS-Setup-${version}.exe"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Grocery POS
publish:
  - provider: github
    owner: shahidmehmoodai52-sketch
    repo: grocery-glee-point
    releaseType: release
