<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tillix POS (Offline)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <style>
    body {
      background: #0b1220;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #22c55e;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>Loading Tillix Offline...</h2>
  <p>Please wait while the application initializes.</p>
  
  <script>
    // The offline shell is served for any navigation (e.g., /pos) when offline.
    // It must trigger the JS router to take over.
    // Since the JS assets are precached, the browser will execute them and
    // TanStack Router will handle the current URL.
    window.addEventListener('load', () => {
      // Small delay to ensure SW has finished its work if needed
      setTimeout(() => {
        // If the JS didn't load (e.g., manifest error), we might need to retry
        if (!window.__TILLIX_BOOTED && navigator.onLine) {
           // window.location.reload(); 
        }
      }, 5000);
    });
  </script>
</body>
</html>
