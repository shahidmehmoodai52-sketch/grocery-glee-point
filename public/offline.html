<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tillix – Offline</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0e1a2e;
        color: #f8fafc;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 32px 24px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(245, 158, 11, 0.15);
        color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.3);
      }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0; font-size: 14px; line-height: 1.6; color: #cbd5e1; }
      button {
        margin-top: 20px;
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 18px;
        border-radius: 10px;
        background: #22c55e;
        color: #06230f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">Offline Mode</span>
      <h1>Tillix isn't cached for this page yet</h1>
      <p>
        You're offline and this screen hasn't been saved on this device. Open Tillix once while
        connected, then it will load without internet next time.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
